repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: no-em-dashes
        name: no em/en dashes
        entry: .venv/bin/python scripts/check_dashes.py
        language: system
        types: [text]
        pass_filenames: true
