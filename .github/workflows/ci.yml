name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v3.2.4
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Check for em/en dashes
        run: |
          if grep -rn $'\u2014\|\u2013' --include='*.py' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.toml' --exclude-dir=.venv . ; then
            echo "Em/en dashes found. Use hyphens instead."
            exit 1
          fi
      - run: uv run mypy agent/ tools/ api/
      - run: uv run pytest
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t pyagent .
